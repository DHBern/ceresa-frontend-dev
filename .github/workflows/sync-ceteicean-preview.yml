name: Sync CETEIcean Preview to WebDAV

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in CETEIcean
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # handle first commit or force push
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git ls-files src/lib/CETEIcean || true)
            echo "$CHANGED" | sed 's/^/A /' > changes.txt
          else
            git diff --name-status "$BEFORE" "$AFTER" | grep '^.\s\+src/lib/CETEIcean' > changes.txt || true
          fi

          if [ ! -s changes.txt ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (WebDAV)
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
            [webdav]
            type = webdav
            url = ${{ secrets.WEBDAV_URL }}
            vendor = apache
            user = ${{ secrets.WEBDAV_USERNAME }}
            pass = ${{ secrets.WEBDAV_PASSWORD }}
          EOF

      - name: Create deployment log entry
        run: |
          DEPLOY_DIR="src/lib/CETEIcean"
          LOG_DIR="$DEPLOY_DIR/logs"

          DATE_FILE=$(date -u +"%Y-%m-%d_%H-%M-%S")
          DATE_HUMAN=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=format:'%an')

          FILENAME="${DATE_FILE}_${COMMIT}.md"

          mkdir -p "$LOG_DIR"

          {
            echo "### Deployment $DATE_HUMAN"
            echo ""
            echo "- Commit: $COMMIT"
            echo "- Author: $AUTHOR"
            echo ""
            echo "#### Changes"
            sed 's/^/- /' changes.txt
          } > "$LOG_DIR/$FILENAME"

          cat "$LOG_DIR/$FILENAME"

      - name: Sync CETEIcean to WebDAV Step 1
        run: |
          ls src/lib/CETEIcean/logs

      - name: Debug WebDAV endpoint
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
        run: |
          echo "URL: ${WEBDAV_URL%/}"
          curl -sSI --max-time 10 "${WEBDAV_URL%/}/preview/" || true

      - name: Debug WebDAV 2
        run: |
          echo "--- proxy env ---"
          env | grep -i proxy || echo "none"
          echo "--- rclone version ---"
          rclone version
          echo "--- PROPFIND as rclone would send it ---"
          AUTH=$(printf '%s:%s' "$WEBDAV_USER" "$WEBDAV_PASS" | base64)
          curl -sv --max-time 15 \
            -H "Authorization: Basic $AUTH" \
            -X PROPFIND -H "Depth: 0" \
            https://dav.arcipelago-ceresa.digitaleditions.ch/preview/ \
            -o /dev/null
          echo "--- rclone with header dump ---"
          rclone lsd webdav: -vv --dump headers 2>&1 | head -120
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}

      - name: Sync CETEIcean to WebDAV Step 2
        run: |
          # 1. sync everything EXCEPT logs
          rclone sync src/lib/CETEIcean webdav:preview --delete-during --exclude "logs/**"

      - name: Sync CETEIcean to WebDAV Step 3
        run: |
          # 2. separately sync logs WITHOUT deletion
          rclone copy src/lib/CETEIcean/logs webdav:preview/logs
